name: android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1" || true
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: android/app/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('android/app/src/main/cpp/**') }}
          restore-keys: cxx-${{ runner.os }}-

      - name: Build debug APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.10.2
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          echo "===== native libs in APK ====="
          unzip -l "$APK" | grep -E "\.so$" || echo "(no .so files!)"

      - uses: actions/upload-artifact@v4
        with:
          name: samu-lab-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
